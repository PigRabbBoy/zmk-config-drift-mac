# Firmware matrix for GitHub Actions.
#
# drift_left / drift_right      - Production Firmware, what you type on.
# drift_test_left / _right      - Test Firmware, flashed only to check the board,
#                                 then replaced. See docs/adr/0001. It reuses the
#                                 shields and only swaps the keymap, via ZMK's
#                                 KEYMAP_FILE cache variable. `base_dir` is the env
#                                 var build-user-config exports for the west
#                                 workspace root, which holds a copy of config/.
---
include:
  - board: nice_nano_v2
    shield: drift_left
  - board: nice_nano_v2
    shield: drift_right

  - board: nice_nano_v2
    shield: drift_left
    cmake-args: -DKEYMAP_FILE=${base_dir}/config/drift_test.keymap
    artifact-name: drift_test_left
  - board: nice_nano_v2
    shield: drift_right
    cmake-args: -DKEYMAP_FILE=${base_dir}/config/drift_test.keymap
    artifact-name: drift_test_right

  - board: nice_nano_v2
    shield: settings_reset
